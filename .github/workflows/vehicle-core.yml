name: Vehicle core

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Headless OpenGL for MuJoCo rendering tests
        run: sudo apt-get update && sudo apt-get install -y libosmesa6
      - name: Install
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,mujoco,viz,train]'
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy
      - name: Test and coverage
        run: pytest --cov --cov-report=term-missing
      - name: Specification conformance
        run: python -m trailer_docking.validation.vehicle_spec
      - name: Generated MJCF is up to date
        run: python -m trailer_docking.simulators.mujoco.builder
