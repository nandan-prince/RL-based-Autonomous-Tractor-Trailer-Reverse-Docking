[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trailer-docking"
version = "0.1.0"
description = "Research environment for autonomous tractor-semitrailer reverse docking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gymnasium>=1.0,<2",
  "numpy>=1.26,<3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
mujoco = [
  "mujoco>=3.14,<4",
]
viz = [
  "matplotlib>=3.8",
]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trailer_docking = [
  "simulators/mujoco/models/*.xml",
  "simulators/mujoco/scenes/*.xml",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = [
  "trailer_docking.core",
  "trailer_docking.environments",
  "trailer_docking.observations",
  "trailer_docking.paths",
  "trailer_docking.safety",
  "trailer_docking.simulators.kinematic",
  "trailer_docking.simulators.mujoco",
  "trailer_docking.validation",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = [
  "src/trailer_docking/core",
  "src/trailer_docking/environments",
  "src/trailer_docking/observations",
  "src/trailer_docking/paths",
  "src/trailer_docking/safety",
  "src/trailer_docking/simulators",
  "src/trailer_docking/validation",
]

[[tool.mypy.overrides]]
module = ["yaml", "mujoco", "mujoco.*"]
ignore_missing_imports = true
