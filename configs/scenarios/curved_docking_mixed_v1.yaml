name: curved-docking-mixed-v1
vehicle_path: configs/vehicles/compact_semitrailer_v1.yaml
dock_path: configs/environments/nominal_dock_v1.yaml
task_path: configs/environments/gymnasium_docking_v1.yaml

# Copy this file under a new name before changing reward values for an
# exploratory run. Formal reward comparisons belong in a reward-study config.
overrides: {}

start:
  standoff: [6.0, 9.0]
  lateral: [-1.2, 1.2]
  trailer_yaw: [-0.06, 0.06]
  articulation: [-0.04, 0.04]

randomization:
  trailer_hitch_to_axle: null
  observation_noise_std: 0.0
  reference_planners: [curve_gentle, curve_early, curve_late]

# Used as the deterministic fallback when reference_planners is removed.
planner: curve_gentle
obstacles: []
