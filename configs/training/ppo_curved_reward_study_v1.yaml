specification_id: ppo-curved-reward-study-v1
schema_version: 1

# Each reward condition is trained independently on the same three seeds.
# Reduce training_seeds or timesteps only for an explicitly named pilot study.
training:
  total_timesteps: 150000
  seed: 0
  learning_rate: 0.0003
  n_steps: 1024
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  clip_range_vf: null
  normalize_advantage: true
  entropy_coefficient: 0.0
  value_coefficient: 0.5
  max_grad_norm: 0.5
  target_kl: null
  device: cpu
  max_episode_steps: 900
  checkpoint_interval: 20000
  purpose: curved-reward-study
  runs: 1
  backend: 2d
  evaluation_episodes: 0
  evaluation_backends: [2d]
  evaluation_seed: 100000
  method: ppo

suite:
  specification_id: compact-docking-suite-v1
  schema_version: 1
  training_seeds: [0, 1, 2]
  validation:
    seed: 100000
    episodes: 20
  test:
    seed: 200000
    episodes: 100

training_seeds: [0, 1, 2]

base_scenario:
  name: curved-reward-study
  vehicle_path: configs/vehicles/compact_semitrailer_v1.yaml
  dock_path: configs/environments/nominal_dock_v1.yaml
  task_path: configs/environments/gymnasium_docking_v1.yaml
  overrides: {}
  start:
    standoff: [6.0, 9.0]
    lateral: [-1.2, 1.2]
    trailer_yaw: [-0.06, 0.06]
    articulation: [-0.04, 0.04]
  randomization:
    reference_planners: [curve_gentle, curve_early, curve_late]
  planner: curve_gentle
  obstacles: []

conditions:
  - name: baseline
    rewards:
      reward_progress: 10.0
      path_lateral_weight: 0.5
      path_heading_weight: 0.2
      reward_articulation: 0.15
      reward_steering_rate: 0.02
      reward_success: 100.0
  - name: tracking-heavy
    rewards:
      reward_progress: 10.0
      path_lateral_weight: 1.5
      path_heading_weight: 0.8
      reward_articulation: 0.15
      reward_steering_rate: 0.02
      reward_success: 100.0
  - name: articulation-aware
    rewards:
      reward_progress: 10.0
      path_lateral_weight: 0.5
      path_heading_weight: 0.2
      reward_articulation: 0.6
      reward_steering_rate: 0.05
      reward_success: 100.0
